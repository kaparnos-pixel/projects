name: Nightly backup

on:
  schedule:
    - cron: "17 22 * * *" # 02:17 Dubai time, every night
  workflow_dispatch:

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install storage clients
        run: npm ci --omit=dev --prefix bifold-tools-api
      - name: Check settings (shows only set / not set)
        env:
          S1: ${{ secrets.STORAGE_CONNECTION }}
          S2: ${{ secrets.BUSINESSTOOLSSTORE }}
        run: |
          echo "Repository secret STORAGE_CONNECTION: $([ -n "$S1" ] && echo set || echo NOT set)"
          echo "Repository secret BUSINESSTOOLSSTORE: $([ -n "$S2" ] && echo set || echo not set)"
          case "$S1$S2" in DefaultEndpointsProtocol=*) echo "Looks like a storage connection string: yes";; *) echo "Looks like a storage connection string: NO (it should start with DefaultEndpointsProtocol=)";; esac
      - name: Back up tables and files
        env:
          NODE_PATH: bifold-tools-api/node_modules
          STORAGE_CONNECTION: ${{ secrets.STORAGE_CONNECTION || secrets.BUSINESSTOOLSSTORE }}
          BACKUP_CONNECTION: ${{ secrets.BACKUP_CONNECTION }}
          KEEP_DAYS: ${{ vars.BACKUP_KEEP_DAYS }}
        run: node .github/scripts/backup.cjs
