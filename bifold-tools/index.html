<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bifold Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f7;--surface:#fff;--line:#d5dce3;--fg:#15222e;--muted:#5b6a78;--accent:#1d4e74}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--surface:#16202a;--line:#2a3846;--fg:#e3e9ef;--muted:#93a3b2;--accent:#7fb3dc;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
h1{font:800 28px "Archivo",system-ui,sans-serif;margin:0}
.who{font-size:13px;color:var(--muted)}
.who a{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.tool{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;color:inherit;text-decoration:none}
a.tool:hover,a.tool:focus-visible{border-color:var(--accent);outline:none}
a.tool h2{font:700 17px "Archivo",system-ui,sans-serif;margin:0 0 4px;color:var(--accent)}
a.tool p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bifold Tools</h1>
    <div class="who"><span id="user"></span> · <a href="/.auth/logout">Sign out</a></div>
  </header>
  <div class="grid">
    <a class="tool" href="/pnl/"><h2>Instant PnL Calculator</h2><p>Enter a PO value and project costs to see profit, margin and break-even.</p></a>
  </div>
</div>
<script>
fetch("/.auth/me").then(r=>r.json()).then(d=>{const p=d.clientPrincipal;if(p)document.getElementById("user").textContent="Signed in as "+p.userDetails}).catch(()=>{});
</script>
</body>
</html>
